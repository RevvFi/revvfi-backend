# Log aggregation stack (Grafana + Loki + Promtail) for the EC2 host.
#
# Completely independent from docker/docker-compose.prod.yml (API + Indexer):
# separate compose project, separate Docker network, separate volumes.
# Stopping/removing this stack never touches the api/indexer containers,
# and stopping the app stack never touches this one.
#
# Usage on the EC2 host, from the repo root:
#   docker compose -f docker/monitoring.prod.yml up -d
#   docker compose -f docker/monitoring.prod.yml down
#
# No Prometheus/metrics here yet — logs only, via the existing json-file
# Docker logging driver the api/indexer containers already use. No changes
# to application code or the existing compose file are required.

networks:
  monitoring:
    name: revvfi-monitoring

volumes:
  loki_data:
    name: revvfi_loki_data
  grafana_data:
    name: revvfi_grafana_data
  promtail_positions:
    name: revvfi_promtail_positions

services:
  loki:
    image: grafana/loki:2.9.8
    container_name: revvfi-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:2.9.8
    container_name: revvfi-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/var/lib/promtail
      # Read-only access to the host's container logs + Docker socket —
      # this is how Promtail discovers and tails revvfi-api/revvfi-indexer
      # without any code changes on their side.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.3
    container_name: revvfi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # Set GF_SECURITY_ADMIN_PASSWORD in the repo-root .env to override
      # this default before exposing Grafana beyond localhost.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Bound to localhost only, same pattern as the api container in
      # docker-compose.prod.yml — nginx will proxy grafana.revvfi.xyz to
      # this port later; nothing else needs to reach it directly.
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
