# Log aggregation stack (Grafana + Loki + Alloy) for the EC2 host.
#
# Completely independent from docker/docker-compose.prod.yml (API + Indexer):
# separate compose project, separate Docker network, separate volumes.
# Stopping/removing this stack never touches the api/indexer containers,
# and stopping the app stack never touches this one.
#
# Usage on the EC2 host, from the repo root:
#   docker compose -f docker/monitoring.prod.yml up -d
#   docker compose -f docker/monitoring.prod.yml down
#
# No Prometheus/metrics here yet — logs only, via the existing json-file
# Docker logging driver the api/indexer containers already use. No changes
# to application code or the existing compose file are required.

networks:
  monitoring:
    name: revvfi-monitoring

volumes:
  loki_data:
    name: revvfi_loki_data
  grafana_data:
    name: revvfi_grafana_data
  alloy_data:
    name: revvfi_alloy_data

services:
  loki:
    image: grafana/loki:2.9.8
    container_name: revvfi-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:1.5.1
    container_name: revvfi-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Docker socket: required — loki.source.docker streams container logs
      # via the Docker API (like `docker logs -f`), and discovery.docker
      # needs it to list containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Not read by Alloy's docker log source (which goes through the API
      # above, not the files), kept mounted only for parity/future use.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      # Alloy's UI (component graph, discovered targets, debug data) —
      # localhost-only, same as Grafana's binding below.
      - "127.0.0.1:12345:12345"
    networks:
      - monitoring
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.3
    container_name: revvfi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # Set GF_SECURITY_ADMIN_PASSWORD in the repo-root .env to override
      # this default before exposing Grafana beyond localhost.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Bound to localhost only, same pattern as the api container in
      # docker-compose.prod.yml — nginx will proxy grafana.revvfi.xyz to
      # this port later; nothing else needs to reach it directly.
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
