services:
  postgres:
    image: postgres:16
    container_name: revvfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revvfi_db
    ports:
      - "5433:5432"
    volumes:
      - revvfi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  revvfi_postgres_data:
