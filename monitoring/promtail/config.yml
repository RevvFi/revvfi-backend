server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # Talking to the Docker socket here is only for *discovering* which
      # containers exist (docker_sd_configs) — the actual log bytes are read
      # straight off the json-file driver's files on disk, mounted below.
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Only ship logs from our own app containers (revvfi-api,
      # revvfi-indexer, ...) — skip everything else running on the host,
      # including the monitoring stack's own containers.
      - source_labels: ["__meta_docker_container_name"]
        regex: "^/(revvfi-(?!loki|promtail|grafana).*)$"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "^/(.*)$"
        target_label: container
      - source_labels: ["__meta_docker_container_id"]
        regex: "(.{12}).*"
        target_label: container_id
        replacement: "${1}"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

    pipeline_stages:
      # Our Go services (internal/logger) emit slog JSON with keys
      # level / timestamp / message / service — pull level and service out
      # as labels and use the app's own timestamp as the log entry time,
      # instead of whenever Promtail happened to read the line.
      - json:
          expressions:
            level: level
            service: service
            timestamp: timestamp
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
