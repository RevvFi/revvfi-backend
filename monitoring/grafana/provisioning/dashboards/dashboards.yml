apiVersion: 1

# Drop dashboard JSON files in this same directory and Grafana will
# auto-load them on startup — nothing to provision yet, this just wires
# the folder up for later.
providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
